<!DOCTYPE html>
<html lang="pl">
<head>
    <meta charset="UTF-8">
    <title>Analiza TailCoR</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <script src="https://cdn.plot.ly/plotly-latest.min.js"></script>
    <style>
        body { background-color: #f4f6f9; }
        .card { box-shadow: 0 4px 6px rgba(0,0,0,0.1); border: none; margin-bottom: 20px; }
        .chart-container { height: 400px; }
        .pie-container { height: 350px; }
        #date-slider { width: 100%; cursor: pointer; }
        #current-date-display { font-weight: bold; color: #0d6efd; }
    </style>
</head>
<body class="container py-4">

    <h2 class="mb-4">Dashboard Analityczny: TailCoR vs Benchmark</h2>

    <div class="card p-4">
        <div class="row">
            <div class="col-md-5">
                <label>Portfel Lewy (Benchmark):</label>
                <select id="select-p1" class="form-select">
                    {% for f in files %}
                    <option value="{{ f.id }}">{{ f.name }} ({{ f.params.start_date }})</option>
                    {% endfor %}
                </select>
            </div>
            <div class="col-md-5">
                <label>Portfel Prawy (TailCoR):</label>
                <select id="select-p2" class="form-select">
                    {% for f in files %}
                    <option value="{{ f.id }}" {% if loop.index == 2 %}selected{% endif %}>{{ f.name }}</option>
                    {% endfor %}
                </select>
            </div>
            <div class="col-md-2 d-flex align-items-end">
                <button onclick="initDashboard()" class="btn btn-primary w-100">Analizuj</button>
            </div>
        </div>
    </div>

    <div class="card p-3">
        <h5>Wartość Portfela (NAV)</h5>
        <div id="nav-chart" class="chart-container"></div>
    </div>

    <div class="card p-3">
        <div class="d-flex justify-content-between align-items-center mb-3">
            <h5>Skład Portfela w czasie</h5>
            <span id="current-date-display">Wybierz datę</span>
        </div>

        <input type="range" class="form-range" id="date-slider" min="0" max="100" value="0" disabled>
        <small class="text-muted text-center d-block">Przesuń suwak, aby zobaczyć alokację w danym dniu</small>

        <div class="row mt-4">
            <div class="col-md-6 text-center">
                <h6>Alokacja Sektorowa (Portfel 1)</h6>
                <div id="pie-1" class="pie-container"></div>
            </div>
            <div class="col-md-6 text-center">
                <h6>Alokacja Sektorowa (Portfel 2)</h6>
                <div id="pie-2" class="pie-container"></div>
            </div>
        </div>
    </div>

    <script>
        // Zmienne globalne do przechowywania stanu
        let allDates = [];
        let currentP1 = null;
        let currentP2 = null;

        async function initDashboard() {
            const id1 = document.getElementById('select-p1').value;
            const id2 = document.getElementById('select-p2').value;
            currentP1 = id1;
            currentP2 = id2;

            // 1. Pobierz szeregi czasowe
            const [data1, data2] = await Promise.all([
                fetch(`/api/series?file_id=${id1}`).then(r => r.json()),
                fetch(`/api/series?file_id=${id2}`).then(r => r.json())
            ]);

            // Zakładamy, że daty są zbieżne, bierzemy daty z pierwszego portfela jako oś czasu
            allDates = data1.dates;

            // 2. Rysuj Wykres NAV
            const trace1 = { x: data1.dates, y: data1.nav, name: 'Portfel 1', type: 'scatter' };
            const trace2 = { x: data2.dates, y: data2.nav, name: 'Portfel 2', type: 'scatter' };

            const layout = {
                margin: {t: 20, b: 40, l: 50, r: 20},
                hovermode: 'x unified',
                xaxis: { title: 'Data' }
            };
            Plotly.newPlot('nav-chart', [trace1, trace2], layout);

            // 3. Skonfiguruj Suwak
            const slider = document.getElementById('date-slider');
            slider.max = allDates.length - 1;
            slider.value = 0;
            slider.disabled = false;

            // Obsługa zdarzenia zmiany suwaka
            slider.oninput = function() {
                const dateIndex = this.value;
                const selectedDate = allDates[dateIndex];
                document.getElementById('current-date-display').innerText = selectedDate;

                // Pobierz i narysuj koła (z debouncingiem można by lepiej, ale tu prosto)
                updatePies(selectedDate);
            };

            // Inicjalizacja kół dla pierwszej daty
            updatePies(allDates[0]);
        }

        async function updatePies(dateStr) {
            // Pobieramy skład dla obu portfeli na ten dzień
            const [comp1, comp2] = await Promise.all([
                fetch(`/api/composition?file_id=${currentP1}&date=${dateStr}`).then(r => r.json()),
                fetch(`/api/composition?file_id=${currentP2}&date=${dateStr}`).then(r => r.json())
            ]);

            // Funkcja pomocnicza do rysowania
            const drawPie = (divId, data) => {
                if (data.error) {
                    document.getElementById(divId).innerHTML = "<p class='text-muted mt-5'>Brak danych</p>";
                    return;
                }

                // Sortowanie danych dla estetyki
                const sectors = Object.keys(data.sectors);
                const values = Object.values(data.sectors);

                const plotData = [{
                    values: values,
                    labels: sectors,
                    type: 'pie',
                    textinfo: 'label+percent',
                    insidetextorientation: 'radial',
                    automargin: true
                }];

                const layout = {
                    margin: {t: 10, b: 10, l: 10, r: 10},
                    showlegend: false
                };

                Plotly.react(divId, plotData, layout);
            };

            drawPie('pie-1', comp1);
            drawPie('pie-2', comp2);
        }

        // Auto start
        window.onload = initDashboard;
    </script>
</body>
</html>
